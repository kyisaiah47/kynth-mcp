# Smithery server manifest. https://smithery.ai
#
# Added 2026-08-20. kynth-mcp was already published to the OFFICIAL MCP registry as
# studio.kynth/kynth-mcp (v0.3.0 live there, verified) and carries glama.json for Glama, but it
# was returning 404 on both smithery.ai and mcp.so. Smithery indexes a GitHub repo when this file
# is present, so its absence was the whole reason.
#
# stdio, npx, no configuration of any kind: every tool here is a read-only lookup over public
# data. There is no API key to collect and configSchema is deliberately empty rather than
# optional-but-present, because an empty config is what lets Smithery list this as a one-click
# server instead of a form.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'kynth-mcp'],
      env: {}
    })
  exampleConfig: {}
